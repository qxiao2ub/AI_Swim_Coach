name: Streamlit smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-312-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source files
        run: python -m compileall -q app.py ai_pipeline.py deep_learning_template.py tests

      - name: Run repository and pipeline tests
        run: |
          python tests/test_repository_layout.py
          python tests/test_runtime_guard.py
          python tests/test_deployment_dependencies.py
          python tests/test_pipeline_smoke.py

      - name: Start Streamlit and check health endpoint
        run: |
          streamlit run app.py \
            --server.headless=true \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
